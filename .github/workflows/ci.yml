name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # MuJoCo renders the reference robots' camera channels headless through OSMesa.
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libosmesa6
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run python scripts/check_boundary.py
      - run: uv run pytest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-py${{ matrix.python }}
          path: artifacts/
          if-no-files-found: error

  wheel:
    # The built wheel, alone in a clean environment: it installs, imports, and loads no
    # simulator, planner, viewer, or robot package. The wheel that passes is retained.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv build --out-dir dist
      - run: uv venv --no-project clean
      - run: uv pip install --python clean dist/*.whl
      - run: uv pip list --python clean
      - run: clean/bin/python scripts/check_boundary.py --installed --report dist/boundary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installed-wheel
          path: |
            dist/*.whl
            dist/boundary.json
          if-no-files-found: error
