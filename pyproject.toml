[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ssgrasping"
version = "0.0.1"
description = "Robot-neutral grasping and manipulation skills over ssrobot: pick, place, drop into a container, retract, guarded moves, and grasp checks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Siddhartha Srinivasa" }]
# Neutral contracts only: no simulator, planner, viewer, or robot package. ssrobot is not
# on an index yet, so it is pinned to a commit.
dependencies = [
    "ssrobot @ git+https://github.com/personalrobotics/ssrobot@e27a25a926d5f429b37b4292d38f784164b8b69c",
]

[dependency-groups]
# Tests run both reference robots in MuJoCo with sscbirrt planning. The robot packages
# are pinned to the commits ssrobot's reference-robot gate pins, and are test fixtures
# only, never runtime dependencies.
dev = [
    "ssrobot[mujoco,planning] @ git+https://github.com/personalrobotics/ssrobot@e27a25a926d5f429b37b4292d38f784164b8b69c",
    "geodude-assets @ git+https://github.com/personalrobotics/geodude_assets@e7be8b437cd954285a9fb515a6de39fb94b3fc42",
    "ada-assets @ git+https://github.com/personalrobotics/ada_assets@e7798beac3eb70145b8d606f4d71720fb75c7ae2",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ssgrasping"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["mujoco.*", "sscbirrt.*", "tsr.*", "geodude_assets.*", "ada_assets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
