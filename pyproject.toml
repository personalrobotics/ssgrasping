[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ssgrasping"
version = "0.0.1"
description = "Robot-neutral grasping and manipulation skills over ssrobot: pick, place, drop into a container, retract, guarded moves, and grasp checks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Siddhartha Srinivasa" }]
# Neutral contracts only: no simulator, planner, viewer, or robot package. ssrobot is not
# on an index yet, so it is pinned to a commit.
dependencies = [
    "ssrobot @ git+https://github.com/personalrobotics/ssrobot@1d3cb77bdd7211304a8e2d898228ba5215e3ce6d",
]

[project.optional-dependencies]
# ssgrasping.sstsr: grasp regions from sstsr's hand templates, with the numpy and scipy it
# uses itself. Only that module imports them; ``import ssgrasping`` never does
# (scripts/check_boundary.py).
sstsr = ["sstsr>=4.2,<5", "numpy>=1.26", "scipy>=1.14"]

[dependency-groups]
# Tests run both reference robots in MuJoCo with sscbirrt planning. The robot packages
# are pinned to the commits ssrobot's reference-robot gate pins, and are test fixtures
# only, never runtime dependencies.
dev = [
    "ssgrasping[sstsr]",
    "ssrobot[mujoco,planning] @ git+https://github.com/personalrobotics/ssrobot@1d3cb77bdd7211304a8e2d898228ba5215e3ce6d",
    "geodude-assets @ git+https://github.com/personalrobotics/geodude_assets@f130a8f435ef7780fbc28014805c25cce6acd67b",
    "ada-assets @ git+https://github.com/personalrobotics/ada_assets@2d8f7972920e4369933065e9131b22dcd5858f2e",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ssgrasping"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["mujoco.*", "sscbirrt.*", "tsr.*", "scipy.*", "geodude_assets.*", "ada_assets.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
